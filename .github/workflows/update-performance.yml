name: Update Collective2 Performance

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-collective2-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Collective2 performance and delayed-trade source data
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
        run: python dashboard.py --public-strategy-data

      - name: Generate Extreme OS public page
        run: python generate_strategy_pages.py --extreme-os-only

      - name: Push daily preview branch
        env:
          PREVIEW_BRANCH: automation/daily-strategies-preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PREVIEW_BRANCH"
          if git diff --quiet -- data/performance_summary.json performance-details.html extreme-os.html api/_member-content/extreme-os.html; then
            echo "Collective2 files are current; creating the shared branch from main."
          else
            git add data/performance_summary.json performance-details.html extreme-os.html api/_member-content/extreme-os.html
            git commit -m "Stage Collective2 daily update"
          fi
          git push --force-with-lease -u origin "$PREVIEW_BRANCH"
