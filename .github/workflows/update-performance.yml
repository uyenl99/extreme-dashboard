name: Update Collective2 Performance

on:
  workflow_dispatch:
  schedule:
    # 20:30 UTC is 12:30 PM PST / 1:30 PM PDT.
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-collective2-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Collective2 performance and delayed-trade source data
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
        run: python dashboard.py --public-strategy-data

      - name: Generate Extreme OS public page
        run: python generate_strategy_pages.py --extreme-os-only

      - name: Push daily preview branch
        env:
          PREVIEW_BRANCH: automation/extreme-os-daily-preview
        run: |
          if git diff --quiet -- performance.html extreme-os.html; then
            echo "No public page changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PREVIEW_BRANCH"
          git add performance.html extreme-os.html
          git commit -m "Update Collective2 preview"
          git push --force-with-lease -u origin "$PREVIEW_BRANCH"
