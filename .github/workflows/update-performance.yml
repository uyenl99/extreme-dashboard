name: Update Collective2 Performance

on:
  workflow_dispatch:
  schedule:
    # 14:00 UTC is 6:00 AM PST / 7:00 AM PDT.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: update-collective2-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Collective2 performance
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
        run: python dashboard.py --performance-only

      - name: Commit updated performance
        run: |
          if git diff --quiet -- performance.html; then
            echo "No performance changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance.html
          git commit -m "Update Collective2 performance"
          git push origin main
