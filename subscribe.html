<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Subscribe - Extreme Trading Inc.</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8fafc;
    color:#222;
}

nav{
    display:flex;
    justify-content:space-between;
    padding:20px 60px;
    background:#111827;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
}

.hero{
    background:#0f172a;
    color:white;
    padding:80px 10%;
}

.hero h1{
    margin:0;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:50px 30px;
}

.cards{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:250px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.price{
    font-size:42px;
    font-weight:bold;
    margin:20px 0;
}

.btn{
    display:inline-block;
    padding:12px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

button.btn{border:0;cursor:pointer;font:inherit}
button.btn:disabled{opacity:.65;cursor:wait}
.notice{max-width:1200px;margin:24px auto 0;padding:0 30px;color:#b91c1c}

footer{
    text-align:center;
    padding:40px;
    color:#666;
}

</style>
</head>

<body>

<nav>
    <div><strong>Extreme Trading Inc.</strong></div>

    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="subscribe.html">Subscribe</a>
    </div>
</nav>

<div class="hero">
    <h1>Extreme Trading Membership</h1>
    <p>Complete payment, then create your member password.</p>
</div>

<div class="section">

<div class="cards">

<div class="card">

<h2>Monthly Membership</h2>

<div class="price">
$100/mo
</div>

<p>
Full member access to strategy updates, performance, live alerts, current positions, and trade history.
</p>

<button class="btn checkout-button" type="button">Subscribe for $100/month</button>

</div>

</div>

</div>

<footer>
© 2026 Extreme Trading Inc.
</footer>

<script>
const params = new URLSearchParams(location.search);
if (params.get("checkout") === "cancelled") {
    const notice = document.createElement("p");
    notice.className = "notice";
    notice.textContent = "Checkout was cancelled. You have not been charged.";
    document.querySelector(".hero").after(notice);
}
document.querySelectorAll(".checkout-button").forEach((button) => button.addEventListener("click", async () => {
    button.disabled = true;
    const response = await fetch("/api/create-checkout-session", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: "{}"
    });
    const payload = await response.json();
    if (payload.url) location.href = payload.url;
    else {
        alert(payload.error || "Unable to start checkout.");
        button.disabled = false;
    }
}));
</script>

</body>
</html>
